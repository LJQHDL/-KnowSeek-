spring:
  application:
    name: enterprise-knowledge-copilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:copilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:25MB}
  jackson:
    time-zone: Asia/Shanghai
  model:
    chat: deepseek
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  ai:
    enabled: ${APP_AI_ENABLED:true}
    retrieval-top-k: ${APP_AI_RETRIEVAL_TOP_K:3}
    embedding-batch-size: ${APP_AI_EMBEDDING_BATCH_SIZE:10}
    fallback-message: ${APP_AI_FALLBACK_MESSAGE:当前模型回答不可用，以下返回的是基于检索片段生成的降级回答。}

knife4j:
  enable: true

server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

logging:
  level:
    root: info
